[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanta-core"
version = "0.1.0"
description = "High-Performance Quantum Computing & Statevector Simulation Engine from Pure Linear Algebra Primitives"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ayush Kandwal", email = "ayushkandwal2007@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
quanta = "quanta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["quanta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
